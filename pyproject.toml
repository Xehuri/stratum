[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stratum"
version = "0.1.1"
description = "Stratum: queryable, auditable, versioned timeline for Markdown knowledge bases"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = []

[project.scripts]
stratum = "stratum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stratum = [
    "schema.sql",
    "schema_v2.sql",
    "schema_v3.sql",
    "demo_data/**/*.md",
    "demo_data/**/*.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
